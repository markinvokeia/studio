<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascota Invoke · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3FB; --surface:#FFFFFF; --ink:#1F1430; --muted:#5A5168; --line:#E6DFF2;
  --brand:#7C3AED; --brand-ink:#FFFFFF; --soft:#EFE8FB; --soft-ink:#3B2466; --pink:#EC4899;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140F1C; --surface:#1E1729; --ink:#F2EEF8; --muted:#B5ABC6; --line:#342A44;
    --brand:#8B5CF6; --soft:#2A2138; --soft-ink:#E4D9FB;
  }
}
:root[data-theme="dark"]{
  --bg:#140F1C; --surface:#1E1729; --ink:#F2EEF8; --muted:#B5ABC6; --line:#342A44;
  --brand:#8B5CF6; --soft:#2A2138; --soft-ink:#E4D9FB;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Poppins,'Segoe UI',system-ui,sans-serif}
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
.brand-mark{width:26px;height:26px;border-radius:9px;background:conic-gradient(from 20deg,#2F9BF2,#8B5CF6,#E040C8,#FF7A3D,#5FD068,#2F9BF2)}
.topbar-note{font-size:13px;color:var(--muted)}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:200px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.nav-item{all:unset;cursor:pointer;padding:10px 14px;border-radius:10px;color:var(--muted);font-weight:500;min-height:24px}
.nav-item:hover{background:var(--soft);color:var(--soft-ink)}
.nav-item.is-active{background:var(--soft);color:var(--soft-ink)}
.nav-item:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.main{flex:1;min-width:0;padding-bottom:64px}
.content{display:flex;flex-wrap:wrap;gap:24px;padding:24px;align-items:flex-start}
.page{flex:999 1 420px;min-width:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:26px;margin:0;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card-time{font-size:13px;color:var(--brand);font-weight:600}
.card-title{font-weight:600}
.card-sub{font-size:13px;color:var(--muted)}
.search{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;max-width:420px;font-size:13px;color:var(--muted)}
.search input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:44px}
.btn{font:500 14px/1.2 Poppins,system-ui,sans-serif;border-radius:999px;padding:10px 14px;min-height:40px;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-soft{background:var(--soft);color:var(--soft-ink);border-color:var(--line)}
.btn-soft:hover{border-color:var(--brand)}
.btn-soft[aria-pressed="true"]{background:var(--brand);color:#fff}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.panel{flex:1 1 340px;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;position:sticky;top:84px;max-height:calc(100vh - 60px - 64px - 190px);overflow:auto}
.panel-head{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.status{font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#22A06B}
.dot-traveling{background:#2F9BF2}.dot-peeking{background:#E58A00}.dot-sleeping{background:#8A8198}
.panel h3{font-size:13px;margin:16px 0 8px;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:500;min-height:44px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--brand)}
.app .widgetbar-zone{position:fixed;left:200px;right:0;bottom:0;z-index:5}
.widgetbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-top:1px solid var(--line);overflow-x:auto}
.widget{white-space:nowrap;background:var(--soft);color:var(--soft-ink);border-radius:12px;padding:8px 12px;font-size:14px}
.widget b{font-weight:600}
@media (max-width:760px){
  .body{flex-direction:column}
  .sidebar{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:8px 12px}
  .app .widgetbar-zone{left:0}
  .panel{position:static;max-height:none;max-width:none}
  .content{padding:16px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
